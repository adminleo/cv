summary: >-
  Technischer Produktverantwortlicher und Architekt, der die ganze Spanne sauber
  ausfüllt — Systementwurf, Technologieentscheidungen und die Führung der Teams,
  die liefern — mit dem Schwerpunkt, Innovation und Produkt zu bauen und beides
  dann zu skalieren. Ebenso zu Hause als technischer PO, Architekt, Tech Lead
  oder im PMO. Zehn Jahre in Softwareprojekten, vier davon tief in angewandter
  KI. Ich analysiere und priorisiere Anforderungen, führe agile Teams durch
  Planung und Reviews und entscheide Architektur und Technologie von
  Microservices und CI/CD bis Cloud und On-Premise. Code lese, prüfe und steuere
  ich täglich in Python und TypeScript — der Großteil des Tippens ist agentisches
  („Vibe") Coding unter meinem Review, nicht meine eigenen Anschläge.
  Produktentscheidungen werden gemessen statt geglaubt — die datengetriebene
  Seite der Rolle. Regulierte Umfelder von innen: Sparkassen-Finanzgruppe,
  öffentliche Hand, C-Level-Arbeit mit börsennotierten Finanz- und
  Gesundheitskonzernen. Als Mitgründer eines
  Company Builders habe ich internationale, mehrsprachige Teams von rund 100
  Personen aufgebaut und geführt. Das Unternehmen um das Produkt herum baue ich
  so selbstverständlich wie das Produkt: acht Gründungen, ~3 Mio. € eingeworben,
  ein Exit vollzogen.

