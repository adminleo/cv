# The CV is data. build.py turns it into the page; nothing is formatted by hand.
#
# Rule for this public version: employers are named, clients are described.
# Naming a former employer is ordinary CV practice. Naming a client on a public
# page is the client's call, not mine — so they appear here by sector and size.

person:
  name: Leonardo Bornhäußer
  headline: Technical Product Owner & Architect · AI products in regulated environments
  location: Berlin · remote
  email: leonardo@creativate.tech
  links:
    - { label: LinkedIn, url: "https://www.linkedin.com/in/leonardo-bornhäußer/" }
    - { label: GitHub,   url: "https://github.com/adminleo" }
    - { label: ORCID,    url: "https://orcid.org/0009-0005-6464-5179" }

summary: >-
  Technical product owner and architect who covers the whole range cleanly —
  system design, the technology decisions, and the leadership of the teams that
  ship — with the focus on building innovation and product and then scaling
  both. Equally at home as technical PO, architect, tech lead or PMO. Ten years
  in software projects, four of them deep in applied AI. I analyse and
  prioritise requirements, guide agile teams through planning and reviews, and
  decide architecture and technology from microservices and CI/CD to cloud and
  on-premise. Code I read, review and direct daily in Python and TypeScript —
  most of the typing is agentic ("vibe") coding under my review rather than my
  own keystrokes. Product decisions are measured rather than believed, which is
  the data-driven side of the role. Regulated environments from the inside: the
  German savings banks group, public administration, C-level work with listed
  financial and healthcare groups. As co-founder of a company builder I built
  and led international, multilingual teams of roughly 100 people.

strengths:
  - { name: Product ownership & delivery,     level: 95 }
  - { name: "Architecture & system design",   level: 90 }
  - { name: Team leadership & scaling,        level: 90 }
  - { name: "Applied AI, agents & LLM orchestration", level: 90 }
  - { name: "Data analysis & experiment design", level: 70 }
  # Deliberately half. I read, review and direct code every day and decide the
  # architecture around it; I am not the one writing the bulk of it, and a bar
  # at 90 here would be the one line on the page a technical interview could
  # disprove in five minutes.
  - { name: Hands-on engineering,            level: 50 }

# Plate carrée, so a pin is just its longitude and latitude. Regions rather
# than street addresses: the teams were distributed, and a pin on a capital
# would claim a precision that was never there.
map:
  note: "Teams and delivery I have led: Europe · sub-Saharan Africa · South Asia"
  pins:
    # Berlin and Frankfurt are 2.4 degrees apart, which is one pixel at this
    # size — two pins there make a blob, not a point. One pin, and the contact
    # line above names both.
    - { name: "Germany — Berlin & Frankfurt", lat: 52.5, lon: 13.4 }
    - { name: sub-Saharan Africa, lat: 4.0,  lon: 18.0 }
    - { name: South Asia,         lat: 29.0, lon: 71.0 }

kpis:
  - { figure: "10+",       label: "years in software projects" }
  - { figure: "7+",        label: "products taken to production" }
  - { figure: "1 M+",      label: "lines of code since 01/2026, built agentically" }
