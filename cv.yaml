  # what I build it with, where it has to hold up — and the stack itself last,
  # on the second sheet, because the stack is the answer to a question nobody
  # asks first.
  #
  # Chip-sized on purpose: the sidebar is 54 mm wide, and a chip that fills the
  # whole line is a bullet wearing a grey background.
  - group: Product ownership & delivery
    items: [Requirements, Prioritisation, Backlog refinement, Sprint planning, Reviews,
            Roadmaps, Business–engineering interface, Stakeholder & C-level,
            Scrum / Kanban, OKRs & KPIs, PMO, Funded projects, Consortium work,
            Nearshore delivery]
  - group: AI, agents & data
    items: [Agentic coding, "\"Vibe coding\"", Anthropic, OpenAI, Gemini, Ollama on-premise,
            MCP, Knowledge graphs, GraphRAG, Model routing, Cost control,
            Confirmation gates, Provenance, Evals, Offline test gates,
            Experiment design, Python, SQL]
  - group: Regulated environments & compliance
    items: [Savings banks group, Listed groups (C-level), Public sector,
            City administration PoC, Deutschland-Stack, FITKO, EU-sovereign AI,
            EU AI Act, GDPR, Information security, BSI baseline protection]
  - group: Architecture, cloud & data
    items: [Microservices, REST / OpenAPI, Event-driven, Docker, Kubernetes, CI/CD,
            DevOps, AWS, Azure, GCP, On-premise, Air-gapped, PostgreSQL, pgvector,
            MongoDB, Graph DB, Observability, TypeScript, Java / Spring (advisory)]

projects:
  - title: "Neurosymbolic reasoning layer — propose neurally, verify symbolically"
    period: 2026 – present · founder, architect & lead · publicly funded R&D
    tech: Python · knowledge graph · OWL/SHACL-style constraints · GraphRAG · open models · automated test suite
    summary: >-
      Model output bound claim by claim to a grounded graph: supported or open,
      never guessed. Decomposition, check, verdict — with a citation path that runs
      deterministically, without a model. Grounded on official registers and
      standards, refreshed through source adapters.
  - title: "AI application and funding assistant for the public sector"
    period: 2026 – present · founder & lead
    tech: Python · Next.js/TypeScript · Java 21 / Spring Boot 3 · PostgreSQL · Docker · GitHub Actions · AWS
    summary: >-
      Pre-filled applications and funding research for public services. Behind
      it a data mesh of structured records as the grounding layer and a
      rule-based Spring Boot routing service that assigns a request
      deterministically and verifiably to the responsible authority.
      Traceability and data sovereignty as design constraints.

  - title: "AI-enabled engineering operating model"
    period: 2024 – present · owner · over 1 million lines of code since 01/2026
    tech: Agentic coding · Anthropic/OpenAI/Gemini APIs · Ollama on-premise · MCP · GitHub Actions · ADRs · offline test gates
    summary: >-
      Ticket as specification, agents implement with access to repository, database
      and APIs, humans review and test, confirmation gate before anything
      irreversible. Consumption tracked per project and role. Quality gates instead
      of trust: contracts, hermetic offline tests, ADRs as the team's memory.

  - title: "Three SaaS products to paying customers"
    period: 2025 – 2026 · founder & lead
    tech: Next.js/TypeScript · FastAPI/Python · Tauri · Stripe · magic-link auth · OAuth · AWS
    summary: >-
      A B2B lead engine with ICP scoring, multi-tenancy, billing and CRM
      integrations; a voice-note-to-task assistant as SaaS and signed desktop
      app; and a trilingual AI readiness check with an automated PDF report.
      Positioning, pricing and service boundaries owned end to end; after market
      feedback, folded into the platform as building blocks rather than run
      separately.

  - title: "Knowledge-graph decision intelligence — open-core platform"
    period: 2024 – present · founder, architect & lead
    tech: Next.js/TypeScript · Python/FastAPI microservices · PostgreSQL/pgvector · graph DB · GPU worker · Docker · Kubernetes/Terraform · AGPL-3.0 + commercial licence
    summary: >-
      Architecture, product ownership and delivery from the first line of code
      to paying tenants: language models bound to a verifiable knowledge store,
      auditable, cloud or fully on-premise. In 2026 I replaced the monolith with
      a service platform carrying its own identity and billing. Open core — a
      tenant is configuration, while grounding, isolation, provenance and the
      confirmation gate stay in the core.
  - title: "Breast-cancer early detection — native mobile and web"
    period: 2023 – 2025 · head of operations / venture lead
    tech: Native iOS/Android · web · MongoDB · AI companion · ultrasound analysis (BI-RADS)
    summary: >-
      Self-examination and referral to specialists in underserved regions, with
      a clinical tool producing a radiologist-reviewed BI-RADS report. Product
